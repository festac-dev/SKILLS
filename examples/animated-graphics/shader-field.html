<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL shader field: flowing noise that reacts to the cursor</title>
<style>
  html,body { margin:0; height:100%; background:#0b0e14; color:#eaf0f8; font:16px/1.5 system-ui,sans-serif; }
  .wrap { position:relative; height:100%; min-height:360px; background:linear-gradient(135deg,#1b2a4a,#3b2a55); }  /* also the no-WebGL fallback */
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .label { position:absolute; left:1rem; bottom:1rem; padding:.4rem .7rem; border-radius:.5rem; background:rgba(0,0,0,.45); font-size:.9rem; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="label"><span id="status">Loading…</span></div>
</div>
<script>
(() => {
  const canvas = document.getElementById('gl'), status = document.getElementById('status');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'low-power' });
  if (!gl) { canvas.remove(); status.textContent = 'WebGL unavailable: showing static fallback.'; window.__demo = { webgl: false }; return; }

  const VS = `#version 300 es
  in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
  const FS = `#version 300 es
  precision mediump float;
  uniform vec2 uRes; uniform float uTime; uniform vec2 uMouse; uniform float uStrength;
  out vec4 o;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
  float fbm(vec2 p){ float v = 0., a = .5; for(int i=0;i<4;i++){ v += a*noise(p); p *= 2.02; a *= .5; } return v; }
  void main(){
    vec2 uv = gl_FragCoord.xy / uRes; vec2 asp = vec2(uRes.x / uRes.y, 1.);
    vec2 q = (uv - .5) * asp;
    vec2 m = (uMouse - .5) * asp;
    float d = length(q - m);
    q += (q - m) * exp(-d * 5.) * .35 * uStrength;                // cursor lens: field bends around the pointer
    float t = uTime * .08;
    float f = fbm(q * 2.5 + vec2(t, -t) + fbm(q * 3. - t));
    vec3 c1 = vec3(.10,.18,.36), c2 = vec3(.45,.30,.65), c3 = vec3(.95,.70,.45);   // demo palette: replace with project tokens
    vec3 col = mix(c1, c2, smoothstep(.25,.65,f)); col = mix(col, c3, smoothstep(.62,.9,f) * .6);
    col += exp(-d * 8.) * .12 * uStrength;                        // soft glow at the cursor
    o = vec4(col, 1.);
  }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  let prog, loc = {}, buf;
  function init() {
    prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);  // one oversized triangle
    const a = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    for (const n of ['uRes','uTime','uMouse','uStrength']) loc[n] = gl.getUniformLocation(prog, n);
    gl.useProgram(prog);
  }
  try { init(); } catch (e) { canvas.remove(); status.textContent = 'Shader failed: static fallback shown.'; console.warn(e); window.__demo = { webgl: false, error: String(e) }; return; }

  let mx = .5, my = .5, sx = .5, sy = .5, strength = 0, tStrength = 0, raf = 0, t0 = performance.now(), frames = 0, visible = true, last = t0, tNow = 0;
  function resize() {
    const dpr = Math.min(1.5, devicePixelRatio || 1);                  // shader cost scales with pixels: cap hard
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  }
  function draw() {
    resize();
    gl.uniform2f(loc.uRes, canvas.width, canvas.height); gl.uniform1f(loc.uTime, tNow); gl.uniform2f(loc.uMouse, sx, sy); gl.uniform1f(loc.uStrength, strength);
    gl.drawArrays(gl.TRIANGLES, 0, 3); frames++;
  }
  function frame(now) {
    raf = 0; const dt = Math.min(.05, (now - last) / 1000); last = now; tNow += dt;
    const k = 1 - Math.exp(-6 * dt); sx += (mx - sx) * k; sy += (my - sy) * k; strength += (tStrength - strength) * k;
    draw(); if (visible && !document.hidden) raf = requestAnimationFrame(frame);
  }
  const start = () => { if (!raf && visible && !document.hidden && !reduced.matches) { last = performance.now(); raf = requestAnimationFrame(frame); } };
  const stop = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };
  canvas.parentElement.addEventListener('pointermove', (e) => { const r = canvas.getBoundingClientRect(); mx = (e.clientX - r.left) / r.width; my = 1 - (e.clientY - r.top) / r.height; tStrength = 1; });
  canvas.parentElement.addEventListener('pointerleave', () => tStrength = 0);
  new IntersectionObserver(([en]) => { visible = en.isIntersecting; visible ? start() : stop(); }).observe(canvas);
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); stop(); status.textContent = 'Graphics context lost; reload to restore.'; });
  reduced.addEventListener('change', () => { reduced.matches ? (stop(), draw()) : start(); status.textContent = reduced.matches ? 'Reduced motion: static frame.' : 'Move the cursor over the field.'; });
  status.textContent = reduced.matches ? 'Reduced motion: static frame.' : 'Move the cursor over the field.';
  draw(); start();
  window.__demo = { webgl: true, frames: () => frames, running: () => !!raf };      // test hook only
})();
</script>
</body>
</html>
